- id: R-Q1A-DEFINITION
  criterion: q1
  description: (a) A file access method is the technique/procedure used by the OS or program to locate,
    read and write records stored in a file on a storage device.
  if:
    fact: covered_q1a_definition
    op: ==
    value: true
  then:
  - action: add
    criterion: q1
    amount: 2.0
  explain: 'Q1(a): A file access method is the technique/procedure used by the OS or program to locate,
    read and write records stored in a file on a storage device. (+2)'
- id: R-Q1A-SEQUENTIAL
  criterion: q1
  description: '(a) Sequential access: records are read/written one after another in the order stored,
